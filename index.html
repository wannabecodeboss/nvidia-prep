const TRACK_COLORS={DSA:"#FF9500","DSA Contest":"#FF9500",CompArch:"#76B9ED",VLSI:"#A855F7",DigDesign:"#FF6B35","Quant Aptitude":"#FCD34D"};
const START=new Date("2026-06-08");const END=new Date("2026-09-07");
const LS_CHECKS="nvidia_prep_checks_v3";
const LS_NOTES="nvidia_prep_notes_v1";
let checks={};let notes={};
try{checks=JSON.parse(localStorage.getItem(LS_CHECKS)||"{}");}catch(e){}
try{notes=JSON.parse(localStorage.getItem(LS_NOTES)||"{}");}catch(e){}

function saveChecks(){
  try{localStorage.setItem(LS_CHECKS,JSON.stringify(checks));setSaveMsg();}catch(e){}
}
function saveNotes(){
  try{localStorage.setItem(LS_NOTES,JSON.stringify(notes));setSaveMsg();}catch(e){}
}
let saveMsgTimer=null;
function setSaveMsg(){
  document.getElementById("last-save").textContent="Saved "+new Date().toLocaleTimeString();
  clearTimeout(saveMsgTimer);
  saveMsgTimer=setTimeout(()=>{document.getElementById("last-save").textContent="Checks + notes auto-saved to your browser";},3000);
}
function topicKey(date,track,idx){return `${date}__${track}__${idx}`;}
function isChecked(date,track,idx){return !!checks[topicKey(date,track,idx)];}
function toggleCheck(date,track,idx){
  const k=topicKey(date,track,idx);checks[k]=!checks[k];
  saveChecks();refreshProgress();
  // update strikethrough on visible element
  const el=document.getElementById('tt-'+k);
  if(el){el.classList.toggle('done',checks[k]);el.classList.toggle('day-topic-text',true);}
  // update day check count
  const day=SCHEDULE[date];if(day){
    let d=0;day.tracks.forEach((t,i)=>{if(isChecked(date,t.track,i))d++;});
    const cc=document.querySelector(`[data-day-check="${date}"]`);
    if(cc){cc.textContent=`${d}/${day.tracks.length}`;cc.style.color=d===day.tracks.length?"#00D4AA":d>0?"#FF9500":"var(--muted)";}
  }
}
function getNote(ds){return notes[ds]||'';}
function saveNote(ds){
  const ta=document.getElementById('notes-ta-'+ds);if(!ta)return;
  notes[ds]=ta.value.trim();saveNotes();
  const msg=document.getElementById('notes-msg-'+ds);if(msg){msg.textContent="Saved";setTimeout(()=>{if(msg)msg.textContent="";},2000);}
  // update toggle button style
  const btn=document.getElementById('notes-btn-'+ds);
  if(btn){btn.classList.toggle('has-note',!!notes[ds]);}
  // update note dot in header
  const dot=document.getElementById('note-dot-'+ds);
  if(dot)dot.style.display=notes[ds]?'inline-block':'none';
  refreshProgress();
}
function toggleNotes(ds){
  const wrap=document.getElementById('notes-area-wrap-'+ds);
  if(!wrap)return;
  const hidden=wrap.style.display==='none'||wrap.style.display==='';
  wrap.style.display=hidden?'block':'none';
  if(hidden){const ta=document.getElementById('notes-ta-'+ds);if(ta)ta.focus();}
}

const TODAY_STR=(()=>{const n=new Date();return n.toISOString().slice(0,10);})();
const TODAY=new Date(TODAY_STR);
function daysBetween(a,b){return Math.round((b-a)/86400000);}
const totalDays=daysBetween(START,END);
const elapsed=Math.max(0,Math.min(totalDays,daysBetween(START,TODAY)));

function getProgress(){
  let all=0,done=0;const byPhase={};
  Object.entries(SCHEDULE).forEach(([ds,day])=>{
    const ph=day.phase;if(!byPhase[ph])byPhase[ph]={all:0,done:0};
    day.tracks.forEach((t,i)=>{all++;byPhase[ph].all++;if(isChecked(ds,t.track,i)){done++;byPhase[ph].done++;}});
  });
  return{all,done,pct:all?Math.round(done/all*100):0,byPhase};
}
function refreshProgress(){
  const p=getProgress();
  const op=Math.round(elapsed/totalDays*100);
  document.getElementById("overall-pct").textContent=op+"%";
  document.getElementById("overall-bar").style.width=op+"%";
  document.getElementById("header-sub").textContent=`Jun 8 -> Sep 7, 2026 | ${elapsed}d elapsed | ${Math.max(0,totalDays-elapsed)}d left | ${p.done}/${p.all} topics done`;
  document.querySelectorAll("[data-day-check]").forEach(el=>{
    const ds=el.dataset.dayCheck;const day=SCHEDULE[ds];if(!day)return;
    let d=0;day.tracks.forEach((t,i)=>{if(isChecked(ds,t.track,i))d++;});
    el.textContent=`${d}/${day.tracks.length}`;
    el.style.color=d===day.tracks.length?"#00D4AA":d>0?"#FF9500":"var(--muted)";
  });
  document.querySelectorAll("[data-phase-check]").forEach(el=>{
    const ph=el.dataset.phaseCheck;
    const bp=getProgress().byPhase[ph]||{done:0,all:0};
    el.textContent=`${bp.done}/${bp.all}`;
  });
}

let currentTab="days";
function showTab(t){
  currentTab=t;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
  render();
}

let openDays=new Set([TODAY_STR]);
let filterPhase="ALL";

function renderDays(){
  const days=Object.values(SCHEDULE);
  let html=`<div class="section-label">TAP A DAY TO CHECK TOPICS | NOTES BUTTON TO ADD DOUBTS | SAVES LOCALLY</div>`;
  html+=`<div class="filter-bar">`;
  ["ALL","P1","P2","P3","P4"].forEach(f=>{
    const c=f==="ALL"?"var(--accent)":(PHASE_META[f]||{color:"var(--muted)"}).color;
    html+=`<button class="filter-btn${filterPhase===f?" active":""}" onclick="setPhaseFilter('${f}')" style="${filterPhase===f?`color:${c};border-color:${c}`:""}">${f==="ALL"?"All Phases":f}</button>`;
  });
  html+=`<button class="jump-btn" onclick="jumpToday()">Today</button></div>`;
  let curMonth="";
  days.forEach(day=>{
    if(filterPhase!=="ALL"&&day.phase!==filterPhase)return;
    const month=day.date.slice(0,7);
    if(month!==curMonth){
      curMonth=month;
      const mLabel=new Date(day.date+"T12:00:00").toLocaleString("default",{month:"long",year:"numeric"});
      html+=`<div class="month-label">${mLabel}</div>`;
    }
    const isToday=day.date===TODAY_STR;
    const isOpen=openDays.has(day.date);
    const phColor=day.phaseColor||"#5A7A9A";
    let doneCount=0,totalCount=day.tracks.length;
    day.tracks.forEach((t,i)=>{if(isChecked(day.date,t.track,i))doneCount++;});
    const allDone=totalCount>0&&doneCount===totalCount;
    const preview=day.isRest?"REST / Review day":(day.tracks[0]?.topic||"");
    const dateDisplay=day.date.slice(5)+" "+day.dayName.toUpperCase();
    const hasNote=!!notes[day.date];
    html+=`<div class="day-card" id="day-${day.date}" style="border-color:${isToday?"#EF4444":allDone?"#00D4AA33":day.isRest?"#1A2F4A":"var(--border)"}">
      <div class="day-header" onclick="toggleDay('${day.date}')">
        <div class="day-date">${dateDisplay}${isToday?'<span class="today-dot"></span>':''}</div>
        <div class="day-phase-dot" style="background:${phColor}"></div>
        <div class="day-preview">${day.isRest?"REST":preview}</div>
        ${hasNote?`<span class="note-dot" id="note-dot-${day.date}"></span>`:`<span class="note-dot" id="note-dot-${day.date}" style="display:none"></span>`}
        <div class="day-check-count" data-day-check="${day.date}" style="color:${allDone?"#00D4AA":doneCount>0?"#FF9500":"var(--muted)"}">${doneCount}/${totalCount}</div>
        <div style="color:var(--muted);font-size:11px;margin-left:4px;flex-shrink:0">${isOpen?"&#9650;":"&#9660;"}</div>
      </div>`;
    if(isOpen){
      html+=`<div class="day-expanded">`;
      if(day.isRest)html+=`<div class="rest-badge">Rest day -- light review only. Recharge.</div>`;
      day.tracks.forEach((t,i)=>{
        const done=isChecked(day.date,t.track,i);
        const tk=topicKey(day.date,t.track,i);
        const isQuant=t.track==="Quant Aptitude";
        html+=`<div class="day-topic-row" onclick="toggleCheck('${day.date}','${t.track}',${i})">
          <input type="checkbox" ${done?"checked":""} onclick="event.stopPropagation();toggleCheck('${day.date}','${t.track}',${i})">
          <span class="track-pill ${isQuant?'quant-pill':''}" style="${isQuant?'':('background:'+t.color+'18;border:1px solid '+t.color+'44;color:'+t.color)}">${t.track}</span>
          <span id="tt-${tk}" class="day-topic-text${done?" done":""}">${t.topic}</span>
        </div>`;
      });
      // Notes section
      const noteVal=getNote(day.date);
      const noteHasContent=!!noteVal;
      html+=`<div class="notes-section">
        <button id="notes-btn-${day.date}" class="notes-toggle${noteHasContent?" has-note":""}" onclick="toggleNotes('${day.date}')">
          ${noteHasContent?"&#9998; Notes (saved)":"&#9998; Add notes / doubts"}
        </button>
        <div id="notes-area-wrap-${day.date}" class="notes-area-wrap" style="display:${noteHasContent?'block':'none'}">
          <textarea id="notes-ta-${day.date}" class="notes-textarea" placeholder="Jot down doubts, key formulas, things to revisit...">${noteVal}</textarea>
          <div class="notes-save-row">
            <button class="notes-save-btn" onclick="saveNote('${day.date}')">Save note</button>
            <span id="notes-msg-${day.date}" class="notes-saved-msg"></span>
          </div>
        </div>
      </div>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  return html;
}

function toggleDay(ds){if(openDays.has(ds))openDays.delete(ds);else openDays.add(ds);render();}
function setPhaseFilter(f){filterPhase=f;render();}
function jumpToday(){
  openDays.add(TODAY_STR);render();
  setTimeout(()=>{const el=document.getElementById("day-"+TODAY_STR);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},100);
}

        <span class="badge" style="background:${pm.color}18;border:1px solid ${pm.color}44;color:${pm.color}">${bp.done}/${bp.all} topics</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="background:${pm.color};width:${pct}%"></div></div>
      <div style="font-size:9px;color:var(--muted);margin-top:3px">${pct}% complete | ${pm.dates}</div>
    </div>`;
  });
  // Notes summary
  const noteEntries=Object.entries(notes).filter(([,v])=>v.trim()).sort(([a],[b])=>a.localeCompare(b));
  if(noteEntries.length>0){
    html+=`<div style="margin-top:14px"><div class="section-label">Saved Notes (${noteEntries.length} days)</div>`;
    noteEntries.forEach(([ds,note])=>{
      const day=SCHEDULE[ds];
      html+=`<div class="card" style="padding:10px 14px;margin-bottom:6px">
        <div style="font-size:9px;color:#F59E0B;margin-bottom:5px;font-family:'Space Mono',monospace">${ds} ${day?day.dayName:''}</div>
        <div style="font-size:11px;color:#8AAAC8;line-height:1.6;white-space:pre-wrap">${note}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}
function getCurrentPhase(){return SCHEDULE[TODAY_STR]?.phase||"P1";}
