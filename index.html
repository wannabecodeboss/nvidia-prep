const TRACK_COLORS = {DSA:"#FF9500","DSA Contest":"#FF9500",CompArch:"#76B9ED",VLSI:"#A855F7",DigDesign:"#FF6B35","Quant Aptitude":"#FCD34D"};
const START = new Date("2026-06-08"); const END = new Date("2026-09-07");

// ── STORAGE ───────────────────────────────────────────────────────────────────
const LS_KEY = "nvidia_prep_checks_v3";
let checks = {};
try { checks = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e){}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(checks)); document.getElementById("last-save").textContent = "Saved " + new Date().toLocaleTimeString(); } catch(e){}
}

function topicKey(date, track, idx) { return `${date}__${track}__${idx}`; }
function isChecked(date, track, idx) { return !!checks[topicKey(date,track,idx)]; }
function toggleCheck(date, track, idx) {
  const k = topicKey(date,track,idx);
  checks[k] = !checks[k];
  save();
  refreshProgress();
}

// ── DATE UTILS ────────────────────────────────────────────────────────────────
const TODAY_STR = (()=>{ const n=new Date(); return n.toISOString().slice(0,10); })();
const TODAY = new Date(TODAY_STR);
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
const totalDays = daysBetween(START,END);
const elapsed = Math.max(0,Math.min(totalDays,daysBetween(START,TODAY)));

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function getProgress() {
  let all=0,done=0; const byPhase={};
  Object.entries(SCHEDULE).forEach(([ds,day])=>{
    const ph=day.phase;
    if(!byPhase[ph]) byPhase[ph]={all:0,done:0};
    day.tracks.forEach((t,i)=>{
      all++; byPhase[ph].all++;
      if(isChecked(ds,t.track,i)){ done++; byPhase[ph].done++; }
    });
  });
  return {all,done,pct:all?Math.round(done/all*100):0,byPhase};
}

function refreshProgress() {
  const p = getProgress();
  const overallPct = Math.round(elapsed/totalDays*100);
  document.getElementById("overall-pct").textContent = overallPct+"%";
  document.getElementById("overall-bar").style.width = overallPct+"%";
  document.getElementById("header-sub").textContent = `Jun 8 → Sep 7, 2026 · ${elapsed}d elapsed · ${Math.max(0,totalDays-elapsed)}d left · ${p.done}/${p.all} topics done`;
  document.querySelectorAll("[data-day-check]").forEach(el=>{
    const ds = el.dataset.dayCheck;
    const day = SCHEDULE[ds]; if(!day) return;
    let d=0; day.tracks.forEach((t,i)=>{ if(isChecked(ds,t.track,i)) d++; });
    el.textContent = `${d}/${day.tracks.length}`;
  });
  document.querySelectorAll("[data-phase-check]").forEach(el=>{
    const ph = el.dataset.phaseCheck;
    const bp = getProgress().byPhase[ph]||{done:0,all:0};
    el.textContent = `${bp.done}/${bp.all}`;
  });
}

// ── TABS ──────────────────────────────────────────────────────────────────────
let currentTab = "days";
function showTab(t) {
  currentTab = t;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
  render();
}

// ── RENDER DAILY VIEW ─────────────────────────────────────────────────────────
let openDays = new Set([TODAY_STR]);
let filterPhase = "ALL";

function renderDays() {
  const days = Object.values(SCHEDULE);
  let html = `<div class="section-label">TAP A DAY TO CHECK TOPICS · ≤2 SUBJECTS/DAY · CHECKS SAVE LOCALLY</div>`;
  html += `<div class="filter-bar">`;
  ["ALL","P1","P2","P3","P4"].forEach(f=>{
    const c = f==="ALL"?"var(--accent)":(PHASE_META[f]||{color:"var(--muted)"}).color;
    html += `<button class="filter-btn${filterPhase===f?" active":""}" onclick="setPhaseFilter('${f}')" style="${filterPhase===f?`color:${c};border-color:${c}`:""}">${f==="ALL"?"All Phases":f}</button>`;
  });
  html += `<button class="jump-btn" onclick="jumpToday()">→ Today</button></div>`;

  let currentMonth = "";
  days.forEach(day => {
    if(filterPhase !== "ALL" && day.phase !== filterPhase) return;
    const month = day.date.slice(0,7);
    if(month !== currentMonth) {
      currentMonth = month;
      const mLabel = new Date(day.date+"T12:00:00").toLocaleString("default",{month:"long",year:"numeric"});
      html += `<div class="month-label">${mLabel}</div>`;
    }
    const isToday = day.date === TODAY_STR;
    const isOpen = openDays.has(day.date);
    const phColor = day.phaseColor || "#5A7A9A";
    let doneCount=0, totalCount=day.tracks.length;
    day.tracks.forEach((t,i)=>{ if(isChecked(day.date,t.track,i)) doneCount++; });
    const allDone = totalCount>0 && doneCount===totalCount;
    const preview = day.isRest ? "REST / Review day" : (day.tracks[0]?.topic||"");
    // Format date with day name: "06-08 Mon"
    const dateDisplay = day.date.slice(5) + " " + day.dayName.toUpperCase();
    html += `<div class="day-card" id="day-${day.date}" style="border-color:${isToday?"#EF4444":allDone?"#00D4AA33":day.isRest?"#1A2F4A":"var(--border)"}">
      <div class="day-header" onclick="toggleDay('${day.date}')">
        <div class="day-date">${dateDisplay}${isToday?'<span class="today-dot"></span>':''}</div>
        <div class="day-phase-dot" style="background:${phColor}"></div>
        <div class="day-preview">${day.isRest?"☽ REST":preview}</div>
        <div class="day-check-count" data-day-check="${day.date}" style="color:${allDone?"#00D4AA":doneCount>0?"#FF9500":"var(--muted)"}">${doneCount}/${totalCount}</div>
        <div style="color:var(--muted);font-size:11px;margin-left:4px;flex-shrink:0">${isOpen?"▲":"▼"}</div>
      </div>`;
    if(isOpen) {
      html += `<div class="day-expanded">`;
      if(day.isRest) html += `<div class="rest-badge">🌙 Rest day — light review only. Recharge.</div>`;
      day.tracks.forEach((t,i)=>{
        const done = isChecked(day.date,t.track,i);
        const isQuant = t.track === "Quant Aptitude";
        html += `<div class="day-topic-row" onclick="toggleCheck('${day.date}','${t.track}',${i})">
          <input type="checkbox" ${done?"checked":""} onclick="event.stopPropagation();toggleCheck('${day.date}','${t.track}',${i})">
          <span class="track-pill ${isQuant?'quant-pill':''}" style="${isQuant?'':'background:'+t.color+'18;border:1px solid '+t.color+'44;color:'+t.color}">${t.track}</span>
          <span class="day-topic-text${done?" done":""}">${t.topic}</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  return html;
}

function toggleDay(ds) {
  if(openDays.has(ds)) openDays.delete(ds); else openDays.add(ds);
  render();
}
function setPhaseFilter(f) { filterPhase=f; render(); }
function jumpToday() {
  openDays.add(TODAY_STR);
  render();
  setTimeout(()=>{ const el=document.getElementById("day-"+TODAY_STR); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },100);
}

// ── RENDER PHASES ─────────────────────────────────────────────────────────────
let openPhases = new Set();
function renderPhases() {
  const prog = getProgress();
  let html = `<div class="section-label">TAP A PHASE TO EXPAND</div>`;
  Object.entries(PHASE_META).forEach(([pid,pm])=>{
    const bp = prog.byPhase[pid]||{done:0,all:0};
    const isOpen = openPhases.has(pid);
    const phaseDays = Object.values(SCHEDULE).filter(d=>d.phase===pid);
    const startD=new Date(phaseDays[0]?.date), endD=new Date(phaseDays[phaseDays.length-1]?.date);
    const timePct = TODAY<startD?0:TODAY>endD?100:Math.round(daysBetween(startD,TODAY)/daysBetween(startD,endD)*100);
    html += `<div class="card" style="border-color:${isOpen?pm.color:"var(--border)"}">
      <div class="card-header" onclick="togglePhase('${pid}')">
        <div class="pid" style="background:${pm.color}18;border:1px solid ${pm.color}44;color:${pm.color}">${pid}</div>
        <div style="flex:1;min-width:140px">
          <div style="font-size:13px;font-weight:700;color:#E8F4FF">${pm.title}</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">${pm.dates}</div>
          <div style="margin-top:5px;width:130px"><div class="progress-bar" style="margin-top:0;height:2px"><div class="progress-fill" style="background:${pm.color};width:${timePct}%"></div></div></div>
        </div>
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
          <span class="badge" style="background:${pm.color}18;border:1px solid ${pm.color}44;color:${pm.color}">${timePct}% time</span>
          <span class="badge" style="background:#76B9ED18;border:1px solid #76B9ED44;color:#76B9ED" data-phase-check="${pid}">${bp.done}/${bp.all}</span>
          <span style="color:var(--muted);font-size:12px">${isOpen?"▲":"▼"}</span>
        </div>
      </div>`;
    if(isOpen) {
      const trackMap = {};
      phaseDays.forEach(day=>{
        day.tracks.forEach((t,i)=>{
          if(!trackMap[t.track]) trackMap[t.track] = [];
          trackMap[t.track].push({date:day.date,topic:t.topic,color:t.color,idx:i,dayName:day.dayName});
        });
      });
      html += `<div class="card-expanded">`;
      Object.entries(trackMap).forEach(([track,items])=>{
        const tc = TRACK_COLORS[track]||"#76B9ED";
        html += `<div class="track-hdr" style="color:${tc}">◈ ${track}</div><div class="track-block" style="border-left-color:${tc}33">`;
        items.forEach(item=>{
          const done = isChecked(item.date,track,item.idx);
          const dateLabel = item.date.slice(5) + " " + item.dayName.toUpperCase();
          html += `<div class="topic-row" onclick="toggleCheck('${item.date}','${track}',${item.idx})">
            <input type="checkbox" ${done?"checked":""} onclick="event.stopPropagation();toggleCheck('${item.date}','${track}',${item.idx})">
            <span style="font-size:8px;color:${tc};flex-shrink:0;margin-top:3px;width:52px">${dateLabel}</span>
            <span class="topic-text${done?" done":""}">${item.topic}</span>
          </div>`;
        });
        html += `</div>`;
      });
      html += `<div class="milestone" style="background:${pm.color}0C;border:1px solid ${pm.color}33">
        <span style="font-size:8px;color:${pm.color};letter-spacing:0.12em;text-transform:uppercase">✓ MILESTONE · </span>${pm.milestone}
      </div></div>`;
    }
    html += `</div>`;
  });
  return html;
}
function togglePhase(pid) { if(openPhases.has(pid)) openPhases.delete(pid); else openPhases.add(pid); render(); }

// ── RENDER PROGRESS ───────────────────────────────────────────────────────────
function renderProgress() {
  const prog = getProgress();
  let html = `<div class="section-label">YOUR PROGRESS — SAVED IN YOUR BROWSER LOCALLY</div>`;
  // Schedule breakdown note
  html += `<div class="card" style="border-color:#1A3A5A;margin-bottom:12px;padding:14px">
    <div style="font-size:9px;color:var(--accent);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:8px">◈ STUDY PLAN RULES</div>
    <div style="font-size:10px;color:#6A8A9A;line-height:1.8">
      P1: DSA + VLSI (Mon/Wed/Fri) · DSA + CompArch (Tue/Thu) · Sat: VLSI + CompArch + DSA Contest + Quant<br>
      P2+: VLSI/DigDesign + CompArch/DigDesign · Sat: VLSI + CompArch + DSA Contest + Quant<br>
      Quant Aptitude: 2hr/week (Wed 1hr + Sat 1hr) · Sun: REST always
    </div>
  </div>`;
  const dLeft = Math.max(0,totalDays-elapsed);
  html += `<div class="stats-grid">
    ${[["Topics Done",`${prog.done}/${prog.all}`,"#00D4AA"],["Days Left",dLeft,"#A855F7"],["Overall",prog.pct+"%","#76B9ED"],["Phase",getCurrentPhase(),"#F59E0B"]].map(([l,v,c])=>
      `<div class="stat-card"><div class="stat-val" style="color:${c}">${v}</div><div class="stat-lbl">${l}</div></div>`).join("")}
  </div>`;
  html += `<div style="margin-top:14px"><div class="section-label">By Phase</div>`;
  Object.entries(PHASE_META).forEach(([pid,pm])=>{
    const bp = prog.byPhase[pid]||{done:0,all:0};
    const pct = bp.all?Math.round(bp.done/bp.all*100):0;
    html += `<div class="card" style="padding:12px 14px;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px">
        <span style="font-size:11px;color:#E8F4FF;font-weight:600">${pid} · ${pm.label}</span>
        <span class="badge" style="background:${pm.color}18;border:1px solid ${pm.color}44;color:${pm.color}">${bp.done}/${bp.all} topics</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="background:${pm.color};width:${pct}%"></div></div>
      <div style="font-size:9px;color:var(--muted);margin-top:3px">${pct}% complete · ${pm.dates}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function getCurrentPhase() {
  const day = SCHEDULE[TODAY_STR];
  return day?.phase||"P1";
}

// ── RENDER WEEKLY ─────────────────────────────────────────────────────────────
function renderWeekly() {
  const wdays = [
    {d:"MON",focus:"P1: DSA + VLSI  |  P2+: VLSI + CompArch",sub:"2 subjects, deep focus",h:"3.5h",c:"#00D4AA"},
    {d:"TUE",focus:"P1: DSA + CompArch  |  P2: DigDesign + VLSI",sub:"2 subjects, deep focus",h:"3.5h",c:"#76B9ED"},
    {d:"WED",focus:"Same as Mon + 1hr Quant Aptitude",sub:"2 main subjects + 1hr quant drill",h:"4h",c:"#A855F7"},
    {d:"THU",focus:"P1: DSA + CompArch  |  P2: DigDesign + VLSI",sub:"2 subjects, deep focus",h:"3.5h",c:"#00D4AA"},
    {d:"FRI",focus:"P1: DSA + VLSI  |  P2+: VLSI + CompArch",sub:"2 subjects, deep focus",h:"3h",c:"#F59E0B"},
    {d:"SAT",focus:"VLSI + CompArch + DSA Contest + 1hr Quant",sub:"Contest mode · 4 tracks (contest day)",h:"5h",c:"#FF6B35"},
    {d:"SUN",focus:"REST — light review only",sub:"Recharge. Draw diagrams. No new material.",h:"1h",c:"#3A5A6A"},
  ];
  let html = `<div class="section-label">WEEKLY TEMPLATE — STRICTLY ≤2 MAIN SUBJECTS/DAY. QUANT: 2HR/WEEK.</div>`;
  wdays.forEach(d=>{
    html += `<div class="week-card" style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;opacity:${d.d==="SUN"?0.55:1}">
      <div class="week-day-name" style="color:${d.c}">${d.d}</div>
      <div style="flex:1">
        <div style="font-size:11px;color:#A0B4C8;margin-bottom:3px">◈ ${d.focus}</div>
        <div style="font-size:10px;color:#4A6A8A">${d.sub}</div>
      </div>
      <span class="badge" style="background:${d.c}18;border:1px solid ${d.c}44;color:${d.c};flex-shrink:0">${d.h}</span>
    </div>`;
  });
  html += `<div style="margin-top:16px;background:var(--surf);border:1px solid var(--border);border-radius:4px;padding:14px">
    <div style="font-size:9px;color:var(--accent);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:10px">◈ SUBJECT SCHEDULE BY PHASE</div>
    <div style="font-size:10px;color:#5A8AAA;line-height:2">
      <b style="color:#00D4AA">Phase 1</b> · Mon/Wed/Fri: DSA + VLSI · Tue/Thu: DSA + CompArch<br>
      <b style="color:#FF6B35">Phase 2</b> · Mon/Wed/Fri: VLSI + CompArch · Tue/Thu: DigDesign + VLSI<br>
      <b style="color:#A855F7">Phase 3</b> · Weekdays: VLSI + CompArch/GPU (alternating)<br>
      <b style="color:#F59E0B">Phase 4</b> · Weekdays: VLSI + CompArch/AI-ML<br>
      <b style="color:#FCD34D">All Phases</b> · Sat: +DSA Contest +Quant Aptitude · Wed: +1hr Quant
    </div>
  </div>`;
  return html;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render() {
  const c = document.getElementById("content");
  if(currentTab==="days") c.innerHTML = renderDays();
  else if(currentTab==="phases") c.innerHTML = renderPhases();
  else if(currentTab==="progress") c.innerHTML = renderProgress();
  else if(currentTab==="weekly") c.innerHTML = renderWeekly();
  refreshProgress();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
refreshProgress();

</script>
</body>
</html>
